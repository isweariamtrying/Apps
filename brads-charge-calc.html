<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff00ff">
<title>Brad's Rad Charge Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Press Start 2P',monospace;
  background:#000;
  color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
  overflow:hidden;
}

/* Animated starfield background */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;
  background:
    radial-gradient(1px 1px at 10% 20%, #ff00ff 50%, transparent 50%),
    radial-gradient(1px 1px at 30% 70%, #00ffff 50%, transparent 50%),
    radial-gradient(1px 1px at 50% 10%, #ffff00 50%, transparent 50%),
    radial-gradient(1px 1px at 70% 50%, #ff00ff 50%, transparent 50%),
    radial-gradient(1px 1px at 90% 80%, #00ff00 50%, transparent 50%),
    radial-gradient(2px 2px at 15% 85%, #00ffff 50%, transparent 50%),
    radial-gradient(1px 1px at 85% 15%, #ffff00 50%, transparent 50%),
    radial-gradient(2px 2px at 45% 45%, #ff6600 50%, transparent 50%),
    radial-gradient(1px 1px at 60% 90%, #ff00ff 50%, transparent 50%),
    radial-gradient(1px 1px at 25% 35%, #00ff00 50%, transparent 50%);
  background-color:#0a0020;
  animation:starPulse 3s ease-in-out infinite alternate;
}
@keyframes starPulse{0%{opacity:0.6;}100%{opacity:1;}}

/* Grid floor effect */
body::after{
  content:'';position:fixed;bottom:0;left:-50%;right:-50%;height:40vh;z-index:0;
  background:
    linear-gradient(transparent 0%, rgba(255,0,255,0.05) 50%, rgba(0,255,255,0.1) 100%),
    repeating-linear-gradient(90deg, rgba(255,0,255,0.15) 0px, transparent 1px, transparent 60px),
    repeating-linear-gradient(0deg, rgba(0,255,255,0.1) 0px, transparent 1px, transparent 40px);
  transform:perspective(300px) rotateX(60deg);
  transform-origin:center top;
}

h1{
  font-size:20px;margin-bottom:4px;
  color:#ff00ff;
  text-shadow:0 0 10px #ff00ff,0 0 20px #ff00ff,0 0 40px #ff00ff,0 0 80px #ff00ff;
  animation:flicker 2s infinite alternate;
  position:relative;z-index:1;
  text-align:center;
  line-height:1.5;
}
@keyframes flicker{
  0%,93%,95%,97%,100%{opacity:1;}
  94%,96%{opacity:0.7;}
}
.subtitle{
  font-size:8px;color:#00ffff;margin-bottom:20px;
  text-shadow:0 0 5px #00ffff,0 0 10px #00ffff;
  position:relative;z-index:1;
  text-align:center;
}
.card{
  background:linear-gradient(135deg,rgba(20,0,40,0.9),rgba(0,10,30,0.9));
  border:2px solid;
  border-image:linear-gradient(135deg,#ff00ff,#00ffff,#ffff00,#ff00ff) 1;
  border-radius:0;
  padding:24px;width:100%;max-width:380px;
  position:relative;z-index:1;
  box-shadow:0 0 15px rgba(255,0,255,0.3),0 0 30px rgba(0,255,255,0.2),inset 0 0 30px rgba(255,0,255,0.05);
}
label{
  display:block;font-size:8px;color:#ffff00;margin-bottom:6px;
  text-shadow:0 0 5px #ffff00;
  letter-spacing:1px;
}
input[type=number]{
  width:100%;padding:12px;font-size:20px;
  font-family:'Press Start 2P',monospace;
  border:2px solid #ff00ff;border-radius:0;
  background:rgba(0,0,0,0.8);color:#00ff00;
  text-align:center;margin-bottom:16px;
  text-shadow:0 0 5px #00ff00,0 0 10px #00ff00;
  box-shadow:inset 0 0 10px rgba(255,0,255,0.2);
}
input[type=number]:focus{outline:none;border-color:#00ffff;box-shadow:0 0 15px rgba(0,255,255,0.5),inset 0 0 10px rgba(0,255,255,0.2);}

.bar-wrap{
  background:#0a0020;border:1px solid #ff00ff;
  height:28px;margin:8px 0 16px;overflow:hidden;position:relative;
  box-shadow:inset 0 0 10px rgba(255,0,255,0.2);
}
.bar-fill{
  height:100%;transition:width 0.3s;
  background:repeating-linear-gradient(90deg,#ff00ff 0px,#ff00ff 4px,#ff66ff 4px,#ff66ff 8px);
  box-shadow:0 0 10px rgba(255,0,255,0.5);
}
.bar-label{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:bold;color:#fff;
  text-shadow:0 0 5px #fff,0 0 10px #ff00ff;
  font-family:'Press Start 2P',monospace;
}
.bar-target{position:absolute;top:0;bottom:0;width:2px;background:#ffff00;opacity:0.9;box-shadow:0 0 5px #ffff00;}

.result{
  background:rgba(0,0,0,0.6);border:1px solid #00ffff;
  padding:16px;text-align:center;margin-top:12px;
  box-shadow:inset 0 0 15px rgba(0,255,255,0.1);
}
.result .time{
  font-size:28px;font-weight:bold;color:#00ff00;
  font-family:'Press Start 2P',monospace;
  text-shadow:0 0 10px #00ff00,0 0 20px #00ff00,0 0 40px #00ff00;
  animation:glow 1.5s ease-in-out infinite alternate;
}
@keyframes glow{0%{text-shadow:0 0 10px #00ff00,0 0 20px #00ff00;}100%{text-shadow:0 0 10px #00ff00,0 0 20px #00ff00,0 0 40px #00ff00,0 0 60px #00ff00;}}
.result .detail{
  font-size:7px;color:#00ffff;margin-top:10px;line-height:2.2;
  white-space:pre-line;
  text-shadow:0 0 3px #00ffff;
}

.specs{
  font-size:7px;color:#ff66ff;margin-top:16px;text-align:center;line-height:2;
  text-shadow:0 0 3px #ff00ff;
  position:relative;z-index:1;
}
.warn{
  color:#ffff00;font-size:8px;margin-top:8px;text-align:center;
  text-shadow:0 0 5px #ffff00,0 0 10px #ffff00;
  animation:warnBlink 0.8s infinite;
}
@keyframes warnBlink{0%,100%{opacity:1;}50%{opacity:0.5;}}

/* Decorative triangles */
.tri{position:fixed;z-index:0;width:0;height:0;opacity:0.15;}
.tri-1{top:10%;left:5%;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:50px solid #ff00ff;animation:spin 8s linear infinite;}
.tri-2{top:60%;right:8%;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:35px solid #00ffff;animation:spin 12s linear infinite reverse;}
.tri-3{bottom:15%;left:15%;border-left:25px solid transparent;border-right:25px solid transparent;border-bottom:40px solid #ffff00;animation:spin 10s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

/* Lightning bolt emoji pulse */
.bolt{
  font-size:40px;margin-bottom:8px;
  animation:boltPulse 1s ease-in-out infinite alternate;
  position:relative;z-index:1;
  filter:drop-shadow(0 0 10px #ffff00) drop-shadow(0 0 20px #ff6600);
}
@keyframes boltPulse{0%{transform:scale(1);}100%{transform:scale(1.15);}}
</style>
</head>
<body>

<div class="tri tri-1"></div>
<div class="tri tri-2"></div>
<div class="tri tri-3"></div>

<div class="bolt">âš¡</div>
<h1>BRAD'S RAD<br>CHARGE TIMER</h1>
<div class="subtitle">48V 20Ah Li-ion (13S4P) Â· 3A Charger Â· v1</div>
<div class="card">
<label>â–¶ CURRENT PACK VOLTAGE (V)</label>
<input type="number" id="volts" step="0.1" min="39" max="54.6" value="44" oninput="calc()">
<div class="bar-wrap">
<div class="bar-fill" id="barFill"></div>
<div class="bar-target" id="barTarget" style="left:85%;"></div>
<div class="bar-label" id="barLabel">0%</div>
</div>
<div class="result" id="result">
<div class="time" id="timeDisplay">--</div>
<div class="detail" id="detailDisplay"></div>
</div>
<div class="warn" id="warnDisplay"></div>
</div>
<div class="specs">
Battery: 13S4P Samsung 50E 21700 Â· 20Ah Â· 39.0Vâ€“54.6V<br>
Charger: 3A CC/CV Â· 85% target â‰ˆ 52.0V<br>
NMC discharge curve lookup (Samsung 50E class)
</div>
<script>
// 13S Li-ion pack parameters (Samsung 50E 21700 NMC)
var CELLS = 13;
var V_MIN = 3.0 * CELLS;   // 39.0V (0% SOC)
var V_MAX = 4.2 * CELLS;   // 54.6V (100% SOC)
var V_80 = 4.00 * CELLS;   // 52.0V (~85% SOC target)
var AH = 20;
var CHARGER_A = 3;

// NMC 21700 cell voltage-vs-SOC lookup table (per cell)
// Samsung 50E class NMC cells
var SOC_TABLE = [
  [3.00,   0],
  [3.10,   2],
  [3.20,   5],
  [3.30,   9],
  [3.40,  14],
  [3.48,  18],
  [3.55,  25],
  [3.60,  30],
  [3.65,  38],
  [3.70,  45],
  [3.75,  52],
  [3.80,  60],
  [3.85,  67],
  [3.90,  74],
  [3.96,  80],
  [4.00,  85],
  [4.05,  90],
  [4.10,  94],
  [4.15,  97],
  [4.20, 100]
];

function voltToSoc(packV) {
  var cellV = packV / CELLS;
  if (cellV <= SOC_TABLE[0][0]) return 0;
  if (cellV >= SOC_TABLE[SOC_TABLE.length-1][0]) return 100;
  for (var i = 1; i < SOC_TABLE.length; i++) {
    if (cellV <= SOC_TABLE[i][0]) {
      var v0 = SOC_TABLE[i-1][0], s0 = SOC_TABLE[i-1][1];
      var v1 = SOC_TABLE[i][0], s1 = SOC_TABLE[i][1];
      return s0 + (s1 - s0) * (cellV - v0) / (v1 - v0);
    }
  }
  return 100;
}

function calc() {
  var v = parseFloat(document.getElementById('volts').value);
  var warn = document.getElementById('warnDisplay');
  var timeEl = document.getElementById('timeDisplay');
  var detailEl = document.getElementById('detailDisplay');
  var barFill = document.getElementById('barFill');
  var barLabel = document.getElementById('barLabel');
  warn.textContent = '';

  if (isNaN(v) || v < V_MIN) {
    timeEl.textContent = '-- : --';
    detailEl.textContent = 'ENTER VOLTAGE ' + V_MIN.toFixed(1) + 'V TO ' + V_MAX.toFixed(1) + 'V';
    barFill.style.width = '0%';
    barLabel.textContent = '0%';
    return;
  }
  if (v >= V_80) {
    timeEl.textContent = 'CHARGED!';
    detailEl.textContent = 'PACK AT ' + voltToSoc(v).toFixed(0) + '% SOC\nALREADY ABOVE 85% â€” RIDE ON!';
    var pct = Math.min(100, voltToSoc(v));
    barFill.style.width = pct + '%';
    barFill.style.background = 'repeating-linear-gradient(90deg,#00ff00 0px,#00ff00 4px,#00cc00 4px,#00cc00 8px)';
    barLabel.textContent = pct.toFixed(0) + '%';
    return;
  }
  if (v > V_MAX) {
    warn.textContent = 'âš  VOLTAGE EXCEEDS PACK MAX (54.6V) âš ';
    return;
  }

  var socNow = voltToSoc(v);
  var socTarget = 85;
  var ahNeeded = ((socTarget - socNow) / 100) * AH;
  var efficiencyFactor = 0.78;
  var hours = ahNeeded / (CHARGER_A * efficiencyFactor);
  var h = Math.floor(hours);
  var m = Math.round((hours - h) * 60);

  var timeStr;
  if (h === 0) timeStr = m + ' MIN';
  else if (m === 0) timeStr = h + 'H';
  else timeStr = h + 'H ' + m + 'M';

  timeEl.textContent = timeStr;
  detailEl.textContent =
    'SOC: ' + socNow.toFixed(0) + '% âžœ TARGET: 85%\n' +
    'Ah NEEDED: ' + ahNeeded.toFixed(1) + ' @ ' + CHARGER_A + 'A\n' +
    'TARGET VOLTAGE: ' + V_80.toFixed(1) + 'V';

  var pct = Math.min(100, socNow);
  barFill.style.width = pct + '%';
  if (socNow < 20) {
    barFill.style.background = 'repeating-linear-gradient(90deg,#ff0000 0px,#ff0000 4px,#ff4444 4px,#ff4444 8px)';
  } else if (socNow < 50) {
    barFill.style.background = 'repeating-linear-gradient(90deg,#ffff00 0px,#ffff00 4px,#ffcc00 4px,#ffcc00 8px)';
  } else {
    barFill.style.background = 'repeating-linear-gradient(90deg,#ff00ff 0px,#ff00ff 4px,#ff66ff 4px,#ff66ff 8px)';
  }
  barLabel.textContent = pct.toFixed(0) + '%';
}

calc();
</script>
</body>
</html>
